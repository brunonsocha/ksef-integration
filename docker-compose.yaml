services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksef-integration
    ports:
      - "8080:8080"
    environment:
      KSEF_TOKEN: ${KSEF_TOKEN:?KSEF_TOKEN is required}
      APP_API_KEY: ${APP_API_KEY:?APP_API_KEY is required}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?DASHBOARD_USERNAME is required}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./certs:/run/ksef-tls:ro
    working_dir: /app
    restart: unless-stopped
